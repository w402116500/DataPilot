[project]
name = "datapilot-datalink"
version = "0.1.0"
description = "Independent versioned data-map service for DataPilot."
requires-python = ">=3.12,<3.13"
dependencies = [
    "datapilot",
    "fastapi>=0.115.0",
    "fastmcp>=3.2.4,<4.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pymysql>=1.1.1,<2",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
datapilot = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.pytest.ini_options]
addopts = "-m 'not live_model'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_model: 使用明确配置的真实 DataLink 模型构建固定 Demo，不进入默认门禁",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
