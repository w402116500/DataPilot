[project]
name = "datapilot"
version = "0.1.0"
description = "A governed local data analysis agent foundation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.2",
    "cryptography>=43.0.0",
    "duckdb>=1.5.5",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pymysql[rsa]>=1.1.2,<2",
    "pytz>=2024.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.32",
    "sqlglot>=30.16.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=1.1.0,<2.0.0",
    "langchain-openai>=1.1.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langsmith>=0.10.18,<0.11.0",
    "mcp>=1.24.0,<2.0.0",
    "fastmcp>=3.2.4,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "apps/api",
    "packages",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live_model'"
testpaths = ["tests"]
pythonpath = [
    "apps/api",
    "packages",
]
markers = [
    "live_docker: 使用已构建的本地 Sandbox 镜像执行真实容器隔离验收，不进入默认门禁",
    "live_model: 使用明确配置的真实 DataLink 模型构建固定 Demo，不进入默认门禁",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
